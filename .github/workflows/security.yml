name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '32 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for dependency changes
        id: manifests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changes=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
            requirements.txt requirements-dev.txt tools/tunisia/requirements.txt frontend/package.json frontend/package-lock.json)
          if [[ -z "$changes" ]]; then
            echo "No dependency manifests changed in this pull request."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install checksum-verified OSV-Scanner
        if: steps.manifests.outputs.changed == 'true'
        shell: bash
        env:
          OSV_VERSION: '2.7.1'
          OSV_SHA256: 'fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8'
        run: |
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            --output "$scanner"
          printf '%s  %s\n' "$OSV_SHA256" "$scanner" | sha256sum --check --strict
          chmod +x "$scanner"
      - name: Compare base and pull request advisories
        if: steps.manifests.outputs.changed == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          manifests=(requirements.txt requirements-dev.txt tools/tunisia/requirements.txt frontend/package-lock.json)
          scan() {
            local revision=$1 label=$2 manifest tracked status=0
            local snapshot="$RUNNER_TEMP/dependencies-$label"
            local lockfiles=()
            mkdir -p "$snapshot"
            tracked=$(git ls-tree -r --name-only "$revision" -- "${manifests[@]}")
            if [[ -z "$tracked" ]]; then
              echo "No supported dependency manifests in $label."
              : > "$snapshot/advisories.tsv"
              return
            fi
            while IFS= read -r manifest; do
              mkdir -p "$(dirname "$snapshot/$manifest")"
              git show "$revision:$manifest" > "$snapshot/$manifest"
              lockfiles+=("--lockfile=$snapshot/$manifest")
            done <<< "$tracked"
            "$RUNNER_TEMP/osv-scanner" scan source --format=json --all-packages \
              "${lockfiles[@]}" \
              --output-file="$snapshot/results.json" || status=$?
            if [[ "$status" -gt 1 ]]; then
              echo "::error::OSV-Scanner failed for $label (exit $status)."
              return "$status"
            fi
            jq -r '
              if (.results | type) != "array" then error("Invalid OSV scan results")
              else .results[].packages[] | .package as $pkg | (.vulnerabilities // [])[]
                | [$pkg.ecosystem, $pkg.name, $pkg.version, .id] | @tsv
              end
            ' "$snapshot/results.json" | LC_ALL=C sort -u > "$snapshot/advisories.tsv"
          }
          scan "$BASE_SHA" base
          scan "$GITHUB_SHA" candidate
          introduced=$(LC_ALL=C comm -13 "$RUNNER_TEMP/dependencies-base/advisories.tsv" \
            "$RUNNER_TEMP/dependencies-candidate/advisories.tsv")
          if [[ -n "$introduced" ]]; then
            echo "::error::The pull request introduces known dependency vulnerabilities."
            printf '%s\n' "$introduced"
            exit 1
          fi
          echo "The pull request introduces no known dependency vulnerabilities."

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable Git history with full redaction
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --no-color --redact=100 --log-opts=HEAD .'
