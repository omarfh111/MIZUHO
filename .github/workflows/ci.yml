name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend pytest
        run: python -m pytest -ra

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Check TypeScript
        run: npm exec -- tsc --noEmit
      - name: Build production assets
        run: npm run build

  integration:
    name: Digital twin browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the API and frontend
        run: |
          python -m pip install -r requirements.txt
          npm --prefix frontend ci
      - name: Build the connected dashboard
        env:
          VITE_DATA_MODE: live
        run: npm --prefix frontend run build
      - name: Exercise the national explorer and irrigation workflows in Chrome
        shell: bash
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          api=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5173 --strictPort) &
          web=$!
          trap 'kill "$api" "$web" 2>/dev/null || true' EXIT
          url=http://127.0.0.1:5173
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 "$url/api/health" |
            python -c 'import json, sys; assert json.load(sys.stdin)["status"] == "ok"'
          npm --prefix frontend run test:integration
