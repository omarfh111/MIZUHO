    <g>
      <use href="#pin" xlink:href="#pin" x="1014" y="271"/>
      <use href="#pin" xlink:href="#pin" x="903" y="247"/>
      <use href="#pin" xlink:href="#pin" x="1112" y="314"/>
      <circle class="motion" cx="1014" cy="271" r="13" fill="none" stroke="#a2fce0" stroke-opacity=".45" stroke-width="1.4">
        <animate attributeName="r" values="8;25;25" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.72;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x=".75" y=".75" width="1278.5" height="558.5" rx="25" fill="none" stroke="#89bfa3" stroke-opacity=".56" stroke-width="1.5"/>
  </g>
</svg>
