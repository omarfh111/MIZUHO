<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 560" role="img" aria-labelledby="title description">
  <title id="title">MIZUHO · Irrigation intelligence</title>
  <desc id="description">A mint water channel carries light past cultivated plots and solar panels in a stylized isometric landscape.</desc>
  <style>
    #still:target ~ .artwork .motion { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="night" x2="1" y2="1">
      <stop stop-color="#071519"/>
      <stop offset="1" stop-color="#102824"/>
    </linearGradient>
    <radialGradient id="mist">
      <stop stop-color="#3c927a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3c927a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunlight">
      <stop stop-color="#edbd77" stop-opacity=".23"/>
      <stop offset="1" stop-color="#edbd77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="20" y1="0" x2="565" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4faf5"/>
      <stop offset=".5" stop-color="#cefbdb"/>
      <stop offset="1" stop-color="#85e4c4"/>
    </linearGradient>
    <linearGradient id="soil" x2="1" y2="1">
      <stop stop-color="#2e6049"/>
      <stop offset=".58" stop-color="#213e39"/>
      <stop offset="1" stop-color="#172c31"/>
    </linearGradient>
    <linearGradient id="rock" x2="0" y2="1">
      <stop stop-color="#233d38"/>
      <stop offset="1" stop-color="#101f25"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#87f8df"/>
      <stop offset="1" stop-color="#32b7c3"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#6ba4b3"/>
      <stop offset=".37" stop-color="#314f68"/>
      <stop offset="1" stop-color="#152a47"/>
    </linearGradient>
    <pattern id="screen" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#90d9b0" stroke-opacity=".066"/>
      <circle cx="0" cy="0" r="1" fill="#a3e6bb" fill-opacity=".2"/>
    </pattern>
    <pattern id="crop" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M2 0v8" stroke="#cce182" stroke-opacity=".44" stroke-width="2"/>
      <path d="M6 0v8" stroke="#111f20" stroke-opacity=".33"/>
    </pattern>
    <pattern id="crop-gold" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M2 0v9" stroke="#e3bd70" stroke-opacity=".39" stroke-width="2"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="560" rx="26"/>
    </clipPath>
    <clipPath id="land">
      <rect width="260" height="260" rx="3"/>
    </clipPath>
    <path id="river" d="M102-12c7 38-13 54-5 81 6 21 38 31 43 55 6 32-31 34-42 59-12 28 8 55 3 89"/>
    <path id="canal" d="M141 130c20 9 36 10 57 10h73"/>
    <g id="panel">
