      <path d="M721 124h37m-18-18v37m463 332h35m-17-17v35"/>
    </g>

    <g transform="translate(81 88)" fill="none">
      <path d="M18 0C18 0 1 20 1 30a17 17 0 0 0 34 0C35 20 18 0 18 0Z" stroke="#97f0d2" stroke-width="2.5"/>
      <path d="M11 34a8 8 0 0 0 7 4" stroke="#d8ffeb" stroke-linecap="round" stroke-width="2"/>
      <circle cx="23" cy="28" r="3.5" fill="#edbd77"/>
    </g>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
      <text x="134" y="122" fill="#a7ceb8" font-size="24" font-weight="650" letter-spacing="3">JENDOUBA PILOT</text>
      <text x="72" y="265" fill="url(#wordmark)" font-size="116" font-weight="820" letter-spacing="-5">MIZUHO</text>
      <text x="81" y="333" fill="#eef8ef" font-size="39" font-weight="570" letter-spacing="-.75">Irrigation intelligence</text>
      <path d="M83 382H613" stroke="#a4d1b4" stroke-opacity=".26"/>
      <text x="82" y="439" fill="#a7c8b9" font-size="29" font-weight="480">Water · Land · Sun</text>
