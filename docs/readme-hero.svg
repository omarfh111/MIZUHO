      <path d="M7.7 1v15M15.3 1v15M1 6h21M1 11h21" fill="none" stroke="#9dc5d2" stroke-opacity=".47" stroke-width=".65"/>
      <path d="M1 2h21" stroke="#d5e7d5" stroke-opacity=".55"/>
