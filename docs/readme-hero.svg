          <path d="M12 87h70l8 24-12 20H12z" fill="url(#crop)"/>
          <path d="M12 138h62l-8 45H12z" fill="#49584a"/>
          <path d="M12 138h62l-8 45H12z" fill="url(#crop-gold)"/>
          <path d="M11 190h53l12 35H11z" fill="#4e7154"/>
          <path d="M11 190h53l12 35H11z" fill="url(#crop)"/>
          <path d="M178 152h74v30l-35 6-39-12z" fill="#49634e"/>
          <path d="M178 152h74v30l-35 6-39-12z" fill="url(#crop-gold)"/>
        </g>
        <path d="M35 258v-20h56m65-27h113M193 147V94h76" fill="none" stroke="#a9d2ac" stroke-opacity=".3" stroke-dasharray="5 4"/>
        <use href="#river" xlink:href="#river" fill="none" stroke="#0d2530" stroke-width="20"/>
        <use href="#river" xlink:href="#river" fill="none" stroke="#37a3ab" stroke-width="12"/>
        <use href="#river" xlink:href="#river" fill="none" stroke="url(#flow)" stroke-width="4"/>
        <use href="#canal" xlink:href="#canal" fill="none" stroke="#15333b" stroke-width="12"/>
        <use href="#canal" xlink:href="#canal" fill="none" stroke="#73e3cc" stroke-width="4.5"/>
        <path d="M122 123c-12-12-17-24-8-27 11-4 25 16 30 26 4 8 6 17 1 24s-19-14-23-23z" fill="#59c7c3" fill-opacity=".76"/>
        <path d="M171 102V46h75v56z" fill="#112526" stroke="#749579" stroke-opacity=".63"/>
        <use href="#panel" xlink:href="#panel" x="178" y="51"/>
        <use href="#panel" xlink:href="#panel" x="209" y="51"/>
        <use href="#panel" xlink:href="#panel" x="178" y="76"/>
        <use href="#panel" xlink:href="#panel" x="209" y="76"/>
        <path d="M207 98v12h-26v25" fill="none" stroke="#ecbf7b" stroke-opacity=".78" stroke-width="1.8" stroke-dasharray="3 2"/>
        <circle class="motion" r="2.8" fill="#ecfffb" stroke="#a1ffea" stroke-width="1.6">
          <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#river" xlink:href="#river"/></animateMotion>
        </circle>
        <circle class="motion" r="2.8" fill="#ecfffb" stroke="#a1ffea" stroke-width="1.6">
          <animateMotion begin="1.5s" dur="5s" repeatCount="indefinite"><mpath href="#canal" xlink:href="#canal"/></animateMotion>
        </circle>
