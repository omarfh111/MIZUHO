    <ellipse cx="1004" cy="263" rx="590" ry="360" fill="url(#mist)"/>
    <ellipse cx="1092" cy="74" rx="310" ry="205" fill="url(#sunlight)"/>
    <rect x="652" width="628" height="560" fill="url(#screen)"/>
    <g fill="none" stroke="#9ad7b2" stroke-opacity=".12">
      <path d="M765 102c70-60 201-79 345-45 99 24 153 73 179 140"/>
      <path d="M754 88c87-73 210-81 348-51 99 22 155 60 190 125"/>
      <path d="M808 477c113 48 241 46 344-11 61-33 110-85 143-145"/>
      <path d="M770 487c119 71 274 76 403 0 53-31 100-74 124-111"/>
