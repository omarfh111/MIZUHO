          <path d="M-19 38C16 4 47 4 68 22s18 32 40 46 42 4 78-19 62-17 84-5"/>
          <path d="M-19 51C16 17 47 17 68 35s18 32 40 46 42 4 78-19 62-17 84-5"/>
          <path d="M-19 64C16 30 47 30 68 48s18 32 40 46 42 4 78-19 62-17 84-5"/>
          <path d="M169 259c-56-14-83-38-91-59-13-32 62-45 110-38 42 7 75 19 91 35"/>
          <path d="M157 269c-55-14-83-38-91-59-13-32 62-45 110-38 42 7 75 19 91 35"/>
          <path d="M145 279c-56-14-83-38-91-59-13-32 62-45 110-38 42 7 75 19 91 35"/>
          <path d="M133 289c-55-14-83-38-91-59-13-32 62-45 110-38 42 7 75 19 91 35"/>
        </g>
        <g stroke="#a6ad73" stroke-opacity=".74">
