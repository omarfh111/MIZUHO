      <path d="M0-37v-6m0 80v6M-37 0h-6m80 0h6M-26-26l-5-5m57 57 5 5m-57-5-5 5m57-57 5-5" stroke="#edbd77" stroke-opacity=".58" stroke-linecap="round"/>
      <circle class="motion" r="20" stroke="#f4cc8c" stroke-opacity=".46" stroke-dasharray="3 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </circle>
    </g>

